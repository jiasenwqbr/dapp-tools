[package]
name = "pcs-substreams"
version = "0.1.0"
description = "PancakeSwap-v2 Substreams"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.79"
prost = { version = "0.13.5" }
prost-types = "0.13.5"
hex = "0.4.3"
num-bigint = "0.4"
bigdecimal = "0.4.8"
pad = "0.1"
substreams = "0.6.1"
substreams-ethereum = "0.10.4"

[build-dependencies]
prost-build = "0.13.5"
