specVersion: v0.1.0
package:
  name: "map_block_sinkdb"
  version: v0.0.2

imports:
  sql: https://github.com/streamingfast/substreams-sink-sql/releases/download/protodefs-v1.0.7/substreams-sink-sql-protodefs-v1.0.7.spkg
  database_change: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v1.2.1/substreams-database-change-v1.2.1.spkg
  # sol: https://spkg.io/streamingfast/solana-common-v0.3.0.spkg
  # main: ./substreams.dev.yaml


network: mainnet

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/pcs_substreams.wasm

modules:
  - name: map_swaps
    kind: map
    inputs:
      - source: "sf.ethereum.type.v2.Block"
    output:
      type: proto:pancake.Swaps

  - name: map_pairs
    kind: map
    initialBlock: 6810705
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:pcs.types.v1.Pairs

  - name: store_pairs
    kind: store
    initialBlock: 6810706
    updatePolicy: set
    valueType: proto:pcs.types.v1.Pair
    inputs:
      - map: map_pairs
  - name: map_tokens
    kind: map
    initialBlock: 6810706
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.ethereum.tokens.v1.Tokens
  - name: store_tokens
    kind: store
    updatePolicy: set
    valueType: proto:sf.ethereum.tokens.v1.Token
    inputs:
      - map: map_tokens
  - name: store_pcs_tokens
    kind: store
    initialBlock: 6810706
    updatePolicy: set_if_not_exists
    valueType: bytes
    inputs:
      - map: map_pairs
      - store: store_tokens

  - name: map_reserves
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pairs
      - store: store_pcs_tokens
    output:
      type: proto:pcs.types.v1.Reserves

  - name: store_reserves
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - source: sf.substreams.v1.Clock
      - map: map_reserves
      - store: store_pairs

  - name: store_prices
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - source: sf.substreams.v1.Clock
      - map: map_reserves
      - store: store_pairs
      - store: store_reserves

  - name: map_burn_swaps_events
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pairs
      - store: store_reserves
      - store: store_pcs_tokens
    output:
      type: proto:pcs.types.v1.Events

  - name: store_totals
    kind: store
    initialBlock: 6810706
    updatePolicy: add
    valueType: int64
    inputs:
      - source: sf.substreams.v1.Clock
      - map: map_pairs
      - map: map_burn_swaps_events

  - name: store_volumes
    kind: store
    updatePolicy: add
    valueType: bigfloat
    inputs:
      - source: sf.substreams.v1.Clock
      - map: map_burn_swaps_events

  - name: db_out_postgres
    kind: map
    initialBlock: 6810706
    inputs:
      - source: sf.substreams.v1.Clock
      - store: store_pcs_tokens
        mode: deltas
      - store: store_pairs
        mode: deltas
      - store: store_totals
        mode: deltas
      - store: store_volumes
        mode: deltas
      - store: store_reserves
        mode: deltas
      - map: map_burn_swaps_events
      - store: store_pcs_tokens
        mode: get
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out_postgres
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "../schema2.sql"
    engine: postgres
    postgraphile_frontend:
      enabled: true

# params:
#   db_out_postgres: factory_address=ca143ce32fe78f1f7019d7d551a6402fc5350c73&protocol_type_name=pancake_v2_pool


